# Runner image: macos-26 (GA 2026-02-26), default Xcode 26.4.1 as of 2026-08-20 (apple-platform-facts).
# Both lanes run scripts/verify.sh — the same script developers run locally.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: verify
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Install tools
        run: brew bundle --file=Brewfile --no-lock 2>/dev/null || brew bundle --file=Brewfile
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Verify
        run: scripts/verify.sh all

  simulators:
    name: simulators
    runs-on: macos-26
    timeout-minutes: 45
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Install tools
        run: brew bundle --file=Brewfile --no-lock 2>/dev/null || brew bundle --file=Brewfile
      - name: Simulator lane
        run: scripts/verify.sh sim
